name: Build StudyFlow Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android WebView APK
        run: |
          set -e

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            PLATFORM_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          else
            PLATFORM_JAR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar
          fi

          echo "Using Build Tools: $BUILD_TOOLS_DIR"
          echo "Using Platform JAR: $PLATFORM_JAR"

          mkdir -p proj/app/src/main/java/com/aistudio/studyflow/ecelpq
          mkdir -p proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/build/gen proj/build/obj proj/build/apk

          cp index.html manifest.webmanifest sw.js proj/app/src/main/assets/

          cat << 'EOF' > proj/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.aistudio.studyflow.ecelpq">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="StudyFlow"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.aistudio.studyflow.ecelpq.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > proj/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">StudyFlow</string>
          </resources>
          EOF

          cat << 'EOF' > proj/app/src/main/java/com/aistudio/studyflow/ecelpq/MainActivity.java
          package com.aistudio.studyflow.ecelpq;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          $BUILD_TOOLS_DIR/aapt2 compile --dir proj/app/src/main/res -o proj/build/resources.zip

          $BUILD_TOOLS_DIR/aapt2 link -o proj/build/unlinked.apk \
              -I "$PLATFORM_JAR" \
              --manifest proj/app/src/main/AndroidManifest.xml \
              --min-sdk-version 24 \
              --target-sdk-version 34 \
              -A proj/app/src/main/assets \
              proj/build/resources.zip \
              --java proj/build/gen

          find proj/app/src/main/java proj/build/gen -name "*.java" > proj/build/sources.txt
          javac -d proj/build/obj -classpath "$PLATFORM_JAR" -source 1.8 -target 1.8 @proj/build/sources.txt

          find proj/build/obj -name "*.class" > proj/build/classes.txt
          $BUILD_TOOLS_DIR/d8 --output proj/build/apk/ --lib "$PLATFORM_JAR" @proj/build/classes.txt

          cd proj/build/apk
          zip -u ../unlinked.apk classes.dex
          cd ../../..

          $BUILD_TOOLS_DIR/zipalign -v -p 4 proj/build/unlinked.apk StudyFlow-aligned.apk

          keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --out StudyFlow.apk StudyFlow-aligned.apk

      - name: Upload StudyFlow Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Android-APK
          path: StudyFlow.apk
